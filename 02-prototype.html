<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FortuneGate · Mobile Prototype</title>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E0B"/><stop offset="1" stop-color="#1A2421"/></linearGradient><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4A017"/><stop offset="1" stop-color="#2E7D32"/></linearGradient></defs>
  <rect width="200" height="200" fill="url(#bgg)"/>
  <rect x="60" y="60" width="80" height="80" rx="20" fill="url(#fg)"/>
  <text x="100" y="124" text-anchor="middle" font-family="Syne, sans-serif" font-weight="800" font-size="56" fill="#0A0E0B">F</text>
</svg>
</template>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --fg-green-900:#1B5E20; --fg-green-700:#2E7D32; --fg-green-500:#43A047; --fg-green-300:#81C784;
    --fg-gold-700:#B8860B; --fg-gold-500:#D4A017; --fg-gold-300:#E8C547;
    --fg-bg-base:#0A0E0B; --fg-bg-raised:#11181C; --fg-bg-overlay:#1A2421;
    --fg-border:rgba(212,160,23,.12); --fg-border-hi:rgba(212,160,23,.32);
    --fg-text-hi:#F5F7F3; --fg-text-mid:#B8C2BC; --fg-text-lo:#6B7770;
    --fg-success:#43A047; --fg-danger:#DC2626;
    --font-display:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box}
  html,body,#root{margin:0;padding:0;height:100%;background:#0a0e0b;font-family:var(--font-body);color:var(--fg-text-hi);overflow:hidden}
  body{
    background:
      radial-gradient(1000px 600px at 80% -10%, rgba(212,160,23,.10), transparent 60%),
      radial-gradient(700px 500px at 0% 100%, rgba(46,125,50,.12), transparent 55%),
      #050706;
  }
  /* device shell */
  .stage{display:flex;align-items:center;justify-content:center;width:100%;height:100%;gap:48px;padding:24px;flex-wrap:wrap}
  .device{
    width:380px;height:780px;border-radius:54px;background:#000;
    padding:12px;
    box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 0 2px #1c1c1c, 0 0 0 4px #2a2a2a, 0 0 60px rgba(212,160,23,.12);
    position:relative;
  }
  .screen{
    width:100%;height:100%;border-radius:42px;overflow:hidden;
    background:var(--fg-bg-base); position:relative;
    display:flex;flex-direction:column;
  }
  .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#000;border-radius:20px;z-index:50}
  .home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:130px;height:5px;border-radius:3px;background:rgba(255,255,255,.45);z-index:50}
  .status{height:54px;display:flex;align-items:center;justify-content:space-between;padding:18px 32px 0;font-family:var(--font-body);font-weight:600;font-size:15px;color:var(--fg-text-hi);position:relative;z-index:1;flex:none}
  .status .ico{display:flex;gap:5px;align-items:center}
  .status .ico .b{width:4px;height:6px;background:currentColor;border-radius:1px}
  .status .ico .b:nth-child(2){height:8px}
  .status .ico .b:nth-child(3){height:10px}
  .status .ico .b:nth-child(4){height:12px}
  .body{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
  .body::-webkit-scrollbar{display:none} .body{scrollbar-width:none}

  /* tokens */
  .glass{background:rgba(17,24,28,.55);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--fg-border);border-radius:20px}
  .glass-gold{background:linear-gradient(135deg,rgba(212,160,23,.10) 0%,rgba(17,24,28,.65) 60%);border:1px solid var(--fg-border-hi);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 32px rgba(212,160,23,.18)}
  .display{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em}
  .num{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .overline{font-family:var(--font-body);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-text-lo)}
  .mid{color:var(--fg-text-mid)}
  .lo{color:var(--fg-text-lo)}
  .btn{font-family:var(--font-display);font-weight:600;border-radius:14px;border:1px solid rgba(255,255,255,.06);padding:14px 20px;text-align:center;cursor:pointer;transition:transform .15s ease,box-shadow .2s ease;font-size:15px;color:var(--fg-text-hi);width:100%;display:block}
  .btn-primary{background:linear-gradient(135deg,var(--fg-green-700),var(--fg-green-500))}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 0 32px rgba(46,125,50,.35)}
  .btn-gold{background:linear-gradient(135deg,var(--fg-gold-500),var(--fg-gold-700));color:#0A0E0B}
  .btn-gold:hover{transform:translateY(-1px);box-shadow:0 0 32px rgba(212,160,23,.35)}
  .btn-ghost{background:transparent;border:1px solid var(--fg-border-hi);color:var(--fg-text-hi)}
  .btn-ghost:hover{border-color:var(--fg-gold-500)}
  .input{width:100%;background:rgba(10,14,11,.6);border:1px solid var(--fg-border);border-radius:14px;padding:14px 16px;color:var(--fg-text-hi);font-family:var(--font-body);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
  .input:focus{border-color:var(--fg-gold-500);box-shadow:0 0 0 3px rgba(212,160,23,.15)}
  .input::placeholder{color:var(--fg-text-lo)}
  .tier{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-family:var(--font-body);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--fg-border)}
  .tier-basic{color:#9aa39d;border-color:rgba(154,163,157,.3);background:rgba(154,163,157,.08)}
  .tier-std{color:var(--fg-green-300);border-color:rgba(67,160,71,.32);background:rgba(67,160,71,.08)}
  .tier-prem{color:var(--fg-gold-300);border-color:var(--fg-border-hi);background:rgba(212,160,23,.10)}
  .tier-vip{color:#E8C547;border-color:rgba(184,134,11,.4);background:rgba(184,134,11,.12)}
  .tier-elite{background:linear-gradient(135deg,rgba(212,160,23,.18),rgba(46,125,50,.18));color:var(--fg-gold-300);border-color:var(--fg-border-hi)}

  .img-ph{
    background:
      linear-gradient(180deg,transparent 0%,rgba(10,14,11,.6) 90%),
      repeating-linear-gradient(135deg,rgba(212,160,23,.06) 0 6px,rgba(67,160,71,.04) 6px 12px),
      var(--fg-bg-raised);
    border-radius:14px;
    position:relative;
  }
  .img-ph::after{content:attr(data-label);position:absolute;left:10px;bottom:10px;font-family:'JetBrains Mono','SF Mono',ui-monospace,monospace;font-size:10px;color:var(--fg-text-lo);letter-spacing:.05em;background:rgba(10,14,11,.6);padding:2px 6px;border-radius:4px}

  .tabbar{
    flex:none;border-top:1px solid var(--fg-border);
    background:rgba(10,14,11,.85);backdrop-filter:blur(18px) saturate(140%);
    display:grid;grid-template-columns:repeat(5,1fr);
    padding:8px 0 22px;
  }
  .tabbar .it{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--fg-text-lo);font-size:10px;font-family:var(--font-body);font-weight:500;border:none;background:transparent;padding:4px}
  .tabbar .it.on{color:var(--fg-gold-500)}
  .tabbar .it svg{width:22px;height:22px}

  .topbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 18px 14px}
  .topbar h1{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
  .icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--fg-border);background:rgba(17,24,28,.55);display:flex;align-items:center;justify-content:center;color:var(--fg-text-hi);cursor:pointer}
  .icon-btn:hover{border-color:var(--fg-border-hi)}

  .sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:flex-end;animation:fade .2s}
  .sheet{width:100%;background:var(--fg-bg-overlay);border-radius:24px 24px 0 0;border-top:1px solid var(--fg-border);padding:14px 20px 28px;animation:slideup .25s cubic-bezier(.2,.8,.2,1)}
  .sheet .grabber{width:36px;height:4px;border-radius:2px;background:var(--fg-text-lo);margin:0 auto 14px}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  @keyframes screenIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  .body > .scr{animation:screenIn .24s cubic-bezier(.2,.8,.2,1)}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:500;font-family:var(--font-body);background:rgba(17,24,28,.55);border:1px solid var(--fg-border);color:var(--fg-text-mid);cursor:pointer;white-space:nowrap}
  .chip.on{background:rgba(212,160,23,.12);border-color:var(--fg-border-hi);color:var(--fg-gold-300)}

  .row{display:flex;align-items:center;gap:8px}
  .stack{display:flex;flex-direction:column}
  .grow{flex:1;min-width:0}
  .pad{padding:0 18px}
  .px{padding-left:18px;padding-right:18px}

  .hint{
    position:absolute;left:50%;transform:translateX(-50%);bottom:-44px;
    font-family:var(--font-body);font-size:13px;color:rgba(245,247,243,.7);
    background:rgba(17,24,28,.7);border:1px solid var(--fg-border);
    padding:8px 14px;border-radius:999px;backdrop-filter:blur(8px);
    white-space:nowrap;
  }
  .hint b{color:var(--fg-gold-500);font-weight:600}

  .nav-rail{
    position:fixed;left:24px;top:24px;bottom:24px;width:240px;
    background:rgba(17,24,28,.55);backdrop-filter:blur(20px) saturate(140%);
    border:1px solid var(--fg-border);border-radius:20px;
    padding:20px;display:flex;flex-direction:column;gap:6px;z-index:100;
    overflow:auto;
  }
  .nav-rail::-webkit-scrollbar{display:none} .nav-rail{scrollbar-width:none}
  .nav-rail h3{font-family:var(--font-display);font-weight:600;font-size:14px;margin:0 0 10px;color:var(--fg-text-mid);letter-spacing:.04em}
  .nav-rail .group{font-family:var(--font-body);font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-text-lo);margin:14px 0 6px;padding:0 8px}
  .nav-rail button{
    text-align:left;background:transparent;border:0;color:var(--fg-text-mid);
    font-family:var(--font-body);font-size:13px;font-weight:500;
    padding:8px 10px;border-radius:8px;cursor:pointer;transition:all .12s
  }
  .nav-rail button:hover{background:rgba(212,160,23,.08);color:var(--fg-text-hi)}
  .nav-rail button.on{background:rgba(212,160,23,.12);color:var(--fg-gold-500);border-left:2px solid var(--fg-gold-500);padding-left:8px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .brand .l{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--fg-gold-500),var(--fg-green-700));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:#0A0E0B;font-size:18px}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:16px}
  .stage-wrap{margin-left:300px;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;padding:24px}
  .stage-wrap .caption{color:var(--fg-text-mid);font-size:13px;text-align:center;max-width:380px}
  .back-link{display:inline-flex;align-items:center;gap:8px;color:var(--fg-text-mid);font-size:13px;text-decoration:none;padding:8px 12px;border-radius:8px}
  .back-link:hover{color:var(--fg-text-hi);background:rgba(212,160,23,.08)}

  @media (max-width:880px){
    .nav-rail{position:relative;left:0;top:0;width:auto;margin:12px;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}
    .nav-rail .group{margin:6px 4px;padding:0}
    .stage-wrap{margin-left:0;padding:0 12px 24px}
    .device{transform:scale(.9);margin:-30px 0}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="prototype-screens.jsx"></script>
<script type="text/babel">
  const { Screens, FLOW } = window;

  function App(){
    const [route, setRoute] = React.useState('splash');
    const [history, setHistory] = React.useState(['splash']);
    const [sheet, setSheet] = React.useState(null);

    const go = (id) => {
      setSheet(null);
      setRoute(id);
      setHistory(h => h.concat(id));
    };
    const back = () => {
      setHistory(h => {
        if(h.length<=1) return h;
        const n = h.slice(0,-1);
        setRoute(n[n.length-1]);
        return n;
      });
    };
    const openSheet = (id) => setSheet(id);
    const closeSheet = () => setSheet(null);

    const ctx = { go, back, openSheet, closeSheet, route };
    const ScreenC = Screens[route] || Screens.splash;
    const SheetC = sheet ? Screens[sheet] : null;

    return (
      <div style={{height:'100%',display:'flex'}}>
        <div className="nav-rail">
          <div className="brand"><div className="l">F</div><div className="brand-name">FortuneGate</div></div>
          <a className="back-link" href="index.html">← All artifacts</a>
          <h3 style={{marginTop:14}}>Prototype</h3>
          {Object.entries(FLOW).map(([group, items]) => (
            <React.Fragment key={group}>
              <div className="group">{group}</div>
              {items.map(([id, label]) => (
                <button key={id} className={route===id?'on':''} onClick={()=>go(id)}>{label}</button>
              ))}
            </React.Fragment>
          ))}
        </div>
        <div className="stage-wrap">
          <div className="device">
            <div className="screen">
              <div className="notch"/>
              <div className="status">
                <span>9:41</span>
                <span className="ico"><span className="b"/><span className="b"/><span className="b"/><span className="b"/></span>
              </div>
              <div className="body" key={route}>
                <div className="scr" style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
                  <ScreenC {...ctx}/>
                </div>
              </div>
              {sheet && (
                <div className="sheet-backdrop" onClick={closeSheet}>
                  <div className="sheet" onClick={e=>e.stopPropagation()}>
                    <div className="grabber"/>
                    <SheetC {...ctx}/>
                  </div>
                </div>
              )}
              <div className="home-ind"/>
            </div>
            <div className="hint">Tap the buttons in the prototype to navigate · or use the menu →</div>
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
