<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FortuneGate · Wireframes</title>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E0B"/><stop offset="1" stop-color="#1A2421"/></linearGradient><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4A017"/><stop offset="1" stop-color="#2E7D32"/></linearGradient></defs>
  <rect width="200" height="200" fill="url(#bgg)"/>
  <rect x="60" y="60" width="80" height="80" rx="20" fill="url(#fg)"/>
  <text x="100" y="124" text-anchor="middle" font-family="Syne, sans-serif" font-weight="800" font-size="56" fill="#0A0E0B">F</text>
</svg>
</template>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Architects+Daughter&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body,#root{margin:0;padding:0;height:100%;font-family:'Kalam','Architects Daughter',sans-serif}
  /* Wireframe primitives — pencil look */
  .wf{
    --ink:#1a1a1a; --ink-2:#444; --ink-3:#888; --paper:#fafaf6;
    --accent:#2E7D32; --gold:#B8860B; --danger:#c0392b;
    background:var(--paper); color:var(--ink); width:100%; height:100%;
    display:flex; flex-direction:column; overflow:hidden;
    border:1.5px solid var(--ink); position:relative;
    font-family:'Kalam',sans-serif;
  }
  .wf .h1{font-family:'Caveat',cursive;font-weight:700;font-size:24px;letter-spacing:.5px;line-height:1.1}
  .wf .h2{font-family:'Caveat',cursive;font-weight:700;font-size:18px;line-height:1.1}
  .wf .lbl{font-family:'Architects Daughter',cursive;font-size:11px;color:var(--ink-2);letter-spacing:.5px}
  .wf .lbl-up{font-family:'Architects Daughter',cursive;font-size:9px;color:var(--ink-3);letter-spacing:1.5px;text-transform:uppercase}
  .wf .body{font-size:13px;line-height:1.35;color:var(--ink-2)}
  .wf .small{font-size:11px;color:var(--ink-3)}
  .wf .box{border:1.5px solid var(--ink); background:#fff; border-radius:6px}
  .wf .box-d{border:1.5px dashed var(--ink-3); background:transparent; border-radius:6px}
  .wf .stripes{background:repeating-linear-gradient(135deg,#eee 0 6px,#fff 6px 12px)}
  .wf .btn{border:1.5px solid var(--ink); background:#fff; border-radius:8px; padding:8px 12px; text-align:center; font-family:'Kalam',sans-serif; font-weight:700; font-size:13px}
  .wf .btn-fill{background:var(--accent); color:#fff; border-color:var(--accent)}
  .wf .btn-gold{background:var(--gold); color:#fff; border-color:var(--gold)}
  .wf .pill{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:2px 8px;font-size:10px;background:#fff}
  .wf .pill-gold{border-color:var(--gold);color:var(--gold);background:#fff8e8}
  .wf .pill-green{border-color:var(--accent);color:var(--accent);background:#e8f5e9}
  .wf .img{background:repeating-linear-gradient(135deg,#e8e6df 0 8px,#f0eee9 8px 16px); border:1.5px solid var(--ink-3); border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--ink-3); font-size:11px}
  .wf .img::before{content:"image"; font-family:'Architects Daughter';}
  .wf .row{display:flex; gap:8px; align-items:center}
  .wf .col{display:flex; flex-direction:column}
  .wf .stack-2 > * + *{margin-top:8px}
  .wf .stack-3 > * + *{margin-top:12px}
  .wf .stack-4 > * + *{margin-top:16px}
  .wf .pad-3{padding:12px}
  .wf .pad-4{padding:16px}
  .wf .pad-5{padding:20px}
  .wf .grow{flex:1; min-height:0}
  .wf .bb{border-bottom:1.5px solid var(--ink)}
  .wf .lock{font-family:'Architects Daughter';color:var(--gold)}
  .wf .center{display:flex;align-items:center;justify-content:center;text-align:center}
  .wf .nav{
    border-top:1.5px solid var(--ink); padding:6px 0 8px;
    display:grid;grid-template-columns:repeat(5,1fr);background:#fff;gap:4px;
  }
  .wf .nav .item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink-3);font-family:'Architects Daughter'}
  .wf .nav .icn{width:20px;height:20px;border:1.5px solid var(--ink-3);border-radius:5px}
  .wf .nav .item.active{color:var(--accent)}
  .wf .nav .item.active .icn{border-color:var(--accent);background:#e8f5e9}
  .wf .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1.5px solid var(--ink)}
  .wf .crumbs{font-family:'Architects Daughter';font-size:10px;color:var(--ink-3)}
  .wf .arrow-l{display:inline-block;width:14px;height:14px;border:1.5px solid var(--ink); border-right:none;border-top:none;transform:rotate(45deg);margin-left:6px}
  /* flow arrows on canvas */
  .flow-arrow{position:absolute;pointer-events:none;z-index:0}
  .flow-arrow path{stroke:#c96442;stroke-width:2;fill:none;stroke-dasharray:6 5;stroke-linecap:round}
  .flow-arrow .head{fill:#c96442}
  .flow-arrow .lbl{font-family:'Caveat',cursive;font-size:18px;font-weight:700;fill:#c96442}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wireframes-screens.jsx"></script>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;
  const W = window.WF; // screens

  function App(){
    const W_W = 280, W_H = 560; // mobile wireframe dim
    const D_W = 920, D_H = 580;  // desktop wireframe dim
    return (
      <DesignCanvas>
        <DCSection id="auth" title="01 · Auth & onboarding" subtitle="Phone-first, OTP, tier intro">
          <DCArtboard id="splash" label="Splash" width={W_W} height={W_H}>{W.Splash()}</DCArtboard>
          <DCArtboard id="register" label="Register · phone" width={W_W} height={W_H}>{W.Register()}</DCArtboard>
          <DCArtboard id="otp" label="OTP" width={W_W} height={W_H}>{W.OTP()}</DCArtboard>
          <DCArtboard id="login" label="Login" width={W_W} height={W_H}>{W.Login()}</DCArtboard>
          <DCArtboard id="onb-tier" label="Tier intro" width={W_W} height={W_H}>{W.OnbTier()}</DCArtboard>
          <DCArtboard id="onb-ref" label="Referral entry" width={W_W} height={W_H}>{W.OnbReferral()}</DCArtboard>
        </DCSection>

        <DCSection id="content" title="02 · Content" subtitle="Browse → detail; locked items prompt upgrade">
          <DCArtboard id="feed" label="Feed · home" width={W_W} height={W_H}>{W.Feed()}</DCArtboard>
          <DCArtboard id="feed-filters" label="Feed · filters open" width={W_W} height={W_H}>{W.FeedFilters()}</DCArtboard>
          <DCArtboard id="feed-locked" label="Feed · locked state" width={W_W} height={W_H}>{W.FeedLocked()}</DCArtboard>
          <DCArtboard id="detail" label="Detail · unlocked" width={W_W} height={W_H}>{W.Detail()}</DCArtboard>
          <DCArtboard id="detail-locked" label="Detail · locked / upgrade" width={W_W} height={W_H}>{W.DetailLocked()}</DCArtboard>
        </DCSection>

        <DCSection id="plans" title="03 · Plans & checkout" subtitle="Basic → Elite, NGN, payment">
          <DCArtboard id="plans-mob" label="Plans · mobile" width={W_W} height={W_H}>{W.Plans()}</DCArtboard>
          <DCArtboard id="checkout" label="Checkout" width={W_W} height={W_H}>{W.Checkout()}</DCArtboard>
          <DCArtboard id="checkout-success" label="Success" width={W_W} height={W_H}>{W.CheckoutSuccess()}</DCArtboard>
          <DCArtboard id="plans-desk" label="Plans · desktop" width={D_W} height={D_H}>{W.PlansDesk()}</DCArtboard>
        </DCSection>

        <DCSection id="dash" title="04 · Dashboard" subtitle="KPIs, activity, referral CTA">
          <DCArtboard id="dash-home" label="Dashboard" width={W_W} height={W_H}>{W.Dashboard()}</DCArtboard>
          <DCArtboard id="earn" label="Earn · referrals" width={W_W} height={W_H}>{W.Earn()}</DCArtboard>
          <DCArtboard id="payouts" label="Payouts" width={W_W} height={W_H}>{W.Payouts()}</DCArtboard>
          <DCArtboard id="giveaway" label="Giveaway" width={W_W} height={W_H}>{W.Giveaway()}</DCArtboard>
          <DCArtboard id="giveaway-entry" label="Giveaway · entered" width={W_W} height={W_H}>{W.GiveawayEntered()}</DCArtboard>
        </DCSection>

        <DCSection id="profile" title="05 · Profile & settings">
          <DCArtboard id="profile" label="Profile" width={W_W} height={W_H}>{W.Profile()}</DCArtboard>
          <DCArtboard id="settings" label="Settings" width={W_W} height={W_H}>{W.Settings()}</DCArtboard>
          <DCArtboard id="notif" label="Notifications" width={W_W} height={W_H}>{W.Notifications()}</DCArtboard>
        </DCSection>

        <DCSection id="admin" title="06 · Admin (desktop)" subtitle="Sidebar shell, content & user tables, dashboard">
          <DCArtboard id="admin-dash" label="Admin · dashboard" width={D_W} height={D_H}>{W.AdminDash()}</DCArtboard>
          <DCArtboard id="admin-content" label="Admin · content table" width={D_W} height={D_H}>{W.AdminContent()}</DCArtboard>
          <DCArtboard id="admin-users" label="Admin · users" width={D_W} height={D_H}>{W.AdminUsers()}</DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
