<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FortuneGate · Desktop</title>
<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E0B"/><stop offset="1" stop-color="#1A2421"/></linearGradient><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4A017"/><stop offset="1" stop-color="#2E7D32"/></linearGradient></defs>
  <rect width="200" height="200" fill="url(#bgg)"/>
  <rect x="60" y="60" width="80" height="80" rx="20" fill="url(#fg)"/>
  <text x="100" y="124" text-anchor="middle" font-family="Syne, sans-serif" font-weight="800" font-size="56" fill="#0A0E0B">F</text>
</svg>
</template>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --fg-green-900:#1B5E20; --fg-green-700:#2E7D32; --fg-green-500:#43A047; --fg-green-300:#81C784;
    --fg-gold-700:#B8860B; --fg-gold-500:#D4A017; --fg-gold-300:#E8C547;
    --fg-bg-base:#0A0E0B; --fg-bg-raised:#11181C; --fg-bg-overlay:#1A2421;
    --fg-border:rgba(212,160,23,.12); --fg-border-hi:rgba(212,160,23,.32);
    --fg-text-hi:#F5F7F3; --fg-text-mid:#B8C2BC; --fg-text-lo:#6B7770;
    --fg-success:#43A047; --fg-warning:#F59E0B; --fg-danger:#DC2626; --fg-info:#0EA5E9;
    --font-display:'Syne',sans-serif; --font-body:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#050706;color:var(--fg-text-hi);font-family:var(--font-body);min-height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 90% -10%, rgba(212,160,23,.08), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(46,125,50,.10), transparent 55%),
      #050706;
  }
  .display{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em}
  .num{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .overline{font-family:var(--font-body);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-text-lo)}
  .mid{color:var(--fg-text-mid)} .lo{color:var(--fg-text-lo)}

  .glass{background:rgba(17,24,28,.55);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid var(--fg-border);border-radius:20px}
  .glass-gold{background:linear-gradient(135deg,rgba(212,160,23,.10) 0%,rgba(17,24,28,.65) 60%);border:1px solid var(--fg-border-hi);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.45),0 0 32px rgba(212,160,23,.18)}

  .btn{font-family:var(--font-display);font-weight:600;border-radius:14px;border:1px solid rgba(255,255,255,.06);padding:10px 18px;cursor:pointer;font-size:14px;color:var(--fg-text-hi);transition:transform .15s, box-shadow .2s}
  .btn-primary{background:linear-gradient(135deg,var(--fg-green-700),var(--fg-green-500))}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 0 32px rgba(46,125,50,.35)}
  .btn-gold{background:linear-gradient(135deg,var(--fg-gold-500),var(--fg-gold-700));color:#0A0E0B}
  .btn-gold:hover{transform:translateY(-1px);box-shadow:0 0 32px rgba(212,160,23,.35)}
  .btn-ghost{background:transparent;border:1px solid var(--fg-border-hi);color:var(--fg-text-hi)}
  .btn-ghost:hover{border-color:var(--fg-gold-500)}

  .input{background:rgba(10,14,11,.6);border:1px solid var(--fg-border);border-radius:14px;padding:10px 14px;color:var(--fg-text-hi);font-family:var(--font-body);font-size:14px;outline:none;width:100%}
  .input:focus{border-color:var(--fg-gold-500);box-shadow:0 0 0 3px rgba(212,160,23,.15)}

  .tier{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-family:var(--font-body);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--fg-border)}
  .tier-basic{color:#9aa39d;background:rgba(154,163,157,.08)}
  .tier-std{color:var(--fg-green-300);border-color:rgba(67,160,71,.32);background:rgba(67,160,71,.08)}
  .tier-prem{color:var(--fg-gold-300);border-color:var(--fg-border-hi);background:rgba(212,160,23,.10)}
  .tier-vip{color:#E8C547;border-color:rgba(184,134,11,.4);background:rgba(184,134,11,.12)}
  .tier-elite{background:linear-gradient(135deg,rgba(212,160,23,.18),rgba(46,125,50,.18));color:var(--fg-gold-300);border-color:var(--fg-border-hi)}

  /* Layout */
  .shell{display:flex;min-height:100vh}
  .sidebar{width:264px;flex:none;background:rgba(17,24,28,.5);backdrop-filter:blur(18px) saturate(140%);border-right:1px solid var(--fg-border);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;margin-bottom:6px;border-bottom:1px solid var(--fg-border)}
  .brand .l{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--fg-gold-500),var(--fg-green-700));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:#0A0E0B;font-size:18px}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
  .brand-sub{font-size:10px;color:var(--fg-text-lo);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .nav-group{font-family:var(--font-body);font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-text-lo);margin:14px 8px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--fg-text-mid);font-size:13.5px;font-weight:500;cursor:pointer;border:none;background:transparent;text-align:left;width:100%;font-family:var(--font-body);position:relative}
  .nav-item:hover{background:rgba(212,160,23,.06);color:var(--fg-text-hi)}
  .nav-item.on{color:var(--fg-gold-500);background:rgba(212,160,23,.10)}
  .nav-item.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--fg-gold-500);border-radius:2px}
  .nav-item svg{width:18px;height:18px;flex:none}
  .nav-item .badge{margin-left:auto;background:var(--fg-danger);color:#fff;font-size:10px;padding:2px 6px;border-radius:8px;font-weight:600}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:64px;flex:none;position:sticky;top:0;background:rgba(10,14,11,.7);backdrop-filter:blur(20px) saturate(140%);border-bottom:1px solid var(--fg-border);display:flex;align-items:center;padding:0 28px;gap:18px;z-index:10}
  .crumbs{font-size:13px;color:var(--fg-text-lo)}
  .crumbs b{color:var(--fg-text-hi);font-weight:500}
  .top-search{flex:1;max-width:520px;margin-left:auto;position:relative}
  .top-search .input{padding-left:38px}
  .top-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-text-lo);width:16px;height:16px}
  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--fg-border);background:rgba(17,24,28,.55);display:flex;align-items:center;justify-content:center;color:var(--fg-text-hi);cursor:pointer}
  .icon-btn:hover{border-color:var(--fg-border-hi)}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--fg-gold-500),var(--fg-green-700));display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#0A0E0B}

  .page{padding:28px 32px;flex:1}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;gap:18px;flex-wrap:wrap}
  .page-head h1{font-family:var(--font-display);font-weight:700;font-size:30px;letter-spacing:-.01em;margin:6px 0 0}

  /* Tabs */
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--fg-border);margin-bottom:18px;overflow:auto}
  .tab{padding:10px 16px;font-size:13px;color:var(--fg-text-mid);cursor:pointer;border:none;background:transparent;border-bottom:2px solid transparent;font-family:var(--font-body);font-weight:500;white-space:nowrap}
  .tab.on{color:var(--fg-gold-500);border-color:var(--fg-gold-500)}

  /* Stats grid */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .kpi{padding:18px}
  .kpi .label{font-size:12px;color:var(--fg-text-lo);font-weight:500}
  .kpi .v{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:28px;margin:8px 0 4px}
  .kpi .delta{font-size:11px;font-weight:600;color:var(--fg-green-300);font-family:var(--font-body)}
  .kpi .delta.bad{color:var(--fg-danger)}

  /* Filter bar */
  .filterbar{display:flex;gap:10px;align-items:center;padding:14px 18px;flex-wrap:wrap;margin-bottom:16px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:500;background:rgba(17,24,28,.55);border:1px solid var(--fg-border);color:var(--fg-text-mid);cursor:pointer}
  .pill.on{background:rgba(212,160,23,.12);border-color:var(--fg-border-hi);color:var(--fg-gold-300)}

  /* Table */
  .table{width:100%;border-collapse:collapse;font-family:var(--font-body)}
  .table thead th{position:sticky;top:64px;background:var(--fg-bg-overlay);font-family:var(--font-body);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-text-lo);text-align:left;padding:12px 18px;border-bottom:1px solid var(--fg-border);white-space:nowrap}
  .table tbody td{padding:14px 18px;border-bottom:1px solid var(--fg-border);font-size:13.5px;color:var(--fg-text-hi);height:56px}
  .table tbody tr{transition:background .12s,border-left-color .12s;border-left:3px solid transparent}
  .table tbody tr:hover{background:rgba(212,160,23,.04);border-left-color:var(--fg-gold-500)}
  .table .num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
  .pag{display:flex;align-items:center;justify-content:center;gap:6px;padding:18px;color:var(--fg-text-mid);font-size:13px}
  .pag .pn{width:34px;height:34px;border-radius:8px;border:1px solid var(--fg-border);background:transparent;color:inherit;cursor:pointer;font-family:var(--font-body)}
  .pag .pn.on{background:rgba(212,160,23,.12);color:var(--fg-gold-300);border-color:var(--fg-border-hi)}

  /* Plans grid */
  .plans-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;align-items:stretch}
  .plan{padding:24px;display:flex;flex-direction:column;gap:14px;position:relative}
  .plan.rec{transform:translateY(-12px)}
  .plan .name{font-family:var(--font-display);font-weight:700;font-size:22px}
  .plan .price{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:38px;letter-spacing:-.02em}
  .plan .price small{font-size:14px;font-weight:500;color:var(--fg-text-mid)}
  .plan ul{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:10px;flex:1}
  .plan li{display:flex;gap:10px;font-size:13px;color:var(--fg-text-mid);align-items:flex-start}
  .plan li svg{flex:none;color:var(--fg-green-500);margin-top:2px}
  .plan .ribbon{position:absolute;top:-12px;right:18px;background:linear-gradient(135deg,var(--fg-gold-500),var(--fg-gold-700));color:#0A0E0B;padding:5px 12px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

  .toggle{display:inline-flex;background:rgba(17,24,28,.55);border:1px solid var(--fg-border);border-radius:999px;padding:4px;gap:2px}
  .toggle button{font-family:var(--font-body);font-weight:600;padding:8px 16px;border:none;background:transparent;color:var(--fg-text-mid);cursor:pointer;border-radius:999px;font-size:13px}
  .toggle button.on{background:rgba(212,160,23,.18);color:var(--fg-gold-300)}

  .stack{display:flex;flex-direction:column}
  .row{display:flex;align-items:center}
  .gap-8{gap:8px} .gap-12{gap:12px} .gap-16{gap:16px} .gap-24{gap:24px}

  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .sd-ok{background:var(--fg-success);box-shadow:0 0 6px var(--fg-success)}
  .sd-warn{background:var(--fg-warning)}
  .sd-bad{background:var(--fg-danger)}

  .img-ph{
    background:
      linear-gradient(180deg,transparent 0%,rgba(10,14,11,.6) 90%),
      repeating-linear-gradient(135deg,rgba(212,160,23,.06) 0 6px,rgba(67,160,71,.04) 6px 12px),
      var(--fg-bg-raised);
    border-radius:10px;
  }

  .ava-sm{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--fg-gold-500),var(--fg-green-700));font-family:var(--font-display);font-weight:700;color:#0A0E0B;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}

  .switch-page{display:flex;gap:6px;margin-bottom:18px;background:rgba(17,24,28,.55);padding:4px;border-radius:14px;border:1px solid var(--fg-border);align-self:flex-start}
  .switch-page button{font-family:var(--font-body);font-weight:600;padding:8px 14px;border:none;background:transparent;color:var(--fg-text-mid);cursor:pointer;border-radius:10px;font-size:13px}
  .switch-page button.on{background:rgba(212,160,23,.16);color:var(--fg-gold-300)}

  .empty-actions{display:flex;gap:10px;align-items:center}

  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--fg-text-mid);font-size:13px;text-decoration:none;padding:6px 0}
  .back-link:hover{color:var(--fg-gold-500)}

  @media (max-width:1100px){
    .kpi-grid{grid-template-columns:repeat(2,1fr)}
    .plans-grid{grid-template-columns:1fr 1fr;}
    .plan.rec{transform:none}
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="desktop-screens.jsx"></script>
<script type="text/babel">
  const {AdminShell, PlansPage, AdminContent, AdminUsers, AdminDashboard} = window;

  function App(){
    const [page, setPage] = React.useState('admin-dash');
    const pages = {
      'admin-dash': <AdminShell page="dash" setPage={setPage}><AdminDashboard/></AdminShell>,
      'admin-content': <AdminShell page="content" setPage={setPage}><AdminContent/></AdminShell>,
      'admin-users': <AdminShell page="users" setPage={setPage}><AdminUsers/></AdminShell>,
      'plans': <PlansPage setPage={setPage}/>,
    };
    return pages[page] || pages['admin-dash'];
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
